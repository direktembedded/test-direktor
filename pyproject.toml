[build-system]
    requires = ["setuptools", "setuptools-scm"]
    build-backend = "setuptools.build_meta"

[project]
    name = "testdirektor"
    description = "Functional Compliance and Diagnostics Test UI using Robot Framework suites"
    readme = "README.md"
    requires-python = ">=3.6"
    keywords = ["fct", "rma", "diagnostic test", "test ui", "test gui"]
    license = {file = "LICENSE"}
    classifiers= [
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: Apache Software License",
        "Operating System :: OS Independent"
    ]
    dependencies = [
        "robotframework-testexecutor-ui",
        "marshmallow_dataclass",
        "argparse"
    ]
    dynamic = ["version"]

[project.urls]
    Homepage = "https://www.direktembedded.com"

[tool.setuptools.dynamic]
    version = {attr = "testdirektor.__version__"}

[project.scripts]
    fct = "testdirektor.fct:run"
    diag = "testdirektor.diag:run"

[project.gui-scripts]
    fct-gui = "testdirektor.fct:run"
    diag-gui = "testdirektor.diag:run"
